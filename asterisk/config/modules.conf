; Which Asterisk modules load (issue #30).
;
; autoload=no: only the modules listed here load. So app_system, the application that runs a
; shell command, is never available, and neither is anything else this project doesn't use.
;
; Every module is `require`, not `load`: "Asterisk will exit with a status code of 2 if a
; required module does not load" (modules.conf.sample in the 22.11.0 tarball). A missing
; module stops the container instead of leaving a PBX that half works.
;
; The dependencies named below come from each module's `.requires` line in the 22.11.0 source.

[modules]
autoload=no

; --- SIP ---
; res_pjsip reads pjsip.conf through the sorcery modules, and keeps registered phones in the
; AstDB (res_sorcery_astdb).
require = res_sorcery_config.so
require = res_sorcery_memory.so
require = res_sorcery_astdb.so
require = res_pjproject.so
require = res_pjsip.so
require = res_pjsip_session.so                   ; calls (INVITE)
require = res_pjsip_pubsub.so                    ; chan_pjsip requires it
require = chan_pjsip.so                          ; the PJSIP/<endpoint> channel that Dial() uses
require = res_pjsip_endpoint_identifier_user.so  ; matches a request to 1001 or 2000 by its From user
require = res_pjsip_authenticator_digest.so      ; challenges each request for that endpoint's password
require = res_pjsip_registrar.so                 ; accepts REGISTER
require = res_pjsip_nat.so                       ; rewrite_contact and the external_* addresses
require = res_pjsip_sdp_rtp.so                   ; the audio part of the SDP offer and answer
require = res_pjsip_caller_id.so                 ; shows the caller's extension on the phone that rings
require = res_pjsip_logger.so                    ; `pjsip set logger on`, for debugging

; --- Audio ---
require = res_rtp_asterisk.so                    ; RTP, configured in rtp.conf
require = codec_ulaw.so
require = codec_alaw.so
require = bridge_simple.so                       ; joins the two sides of a call

; --- Dialplan ---
require = pbx_config.so                          ; reads extensions.conf
require = app_dial.so
