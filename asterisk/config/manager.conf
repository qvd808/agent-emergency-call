; The manager interface (AMI), for the agent's escalation (issue #20): it finds its call's
; channel with `Status` and transfers it to the dispatcher with `Redirect`.
;
; Reached only from the laptop: docker-compose.yml publishes 5038 on 127.0.0.1, never on the
; Wi-Fi (issue #27). Inside the container Asterisk has to listen on every address, because
; Docker's port forwarding delivers to the container's own address, not its loopback
; (inferred). Every connection arrives from Docker's gateway (issue #30), so a permit/deny ACL
; here would add nothing; the long random secret is the check.
;
; Settings and defaults from the 22.11.0 source, via docs/research/asterisk-manager-interface.md
; (branch research/asterisk-manager-interface), section 4.

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
; AMI over HTTP stays off.
webenabled = no

; The agent's account: its secret is generated into .env by asterisk/configure.sh.
#include "manager_generated.conf"
