; The dialplan: what happens when a phone dials a number (issue #14).
;
; Safety rule: internal extensions only. Each extension below is a literal number that rings
; one of this PBX's own phones or connects to the agent on this laptop, plus `h`, which runs
; when a call ends. There is no pattern (an extension starting with `_`), no emergency number,
; and no trunk to any other network, so nothing dialled here can leave this PBX.

[general]
static=yes
; `dialplan save` can't overwrite this file. It is also mounted read-only.
writeprotect=yes

; Every phone's calls start here: `context=from-phones` in pjsip.conf.
[from-phones]
exten => 1001,1,Dial(PJSIP/1001,30)   ; the resident's phone: Linphone on Android
 same => n,Hangup()

exten => 2000,1,Dial(PJSIP/2000,30)   ; the dispatcher's softphone: Linphone on an iPad
 same => n,Hangup()

; 3100: the check-in agent (issue #15). The call is handed to the agent over AudioSocket, the
; application form: one channel, so the channel saved below is the one to transfer (issue #4).
exten => 3100,1,Answer()                 ; AudioSocket() doesn't answer; it fails on an unanswered call
 ; The agent learns only this UUID from the socket. Two AstDB entries keyed by it tell the
 ; agent the rest: the channel name, which AMI's Redirect needs to transfer the call to 2000,
 ; and the caller's extension, which says which resident is calling (issue #13).
 same => n,Set(AS_UUID=${UUID()})
 same => n,Set(DB(audiosocket_channel/${AS_UUID})=${CHANNEL})
 same => n,Set(DB(audiosocket_caller/${AS_UUID})=${CALLERID(num)})
 ; Saved before the socket opens, so the agent can't look them up before they exist.
 ; host.docker.internal is the Ubuntu side, where the agent listens on 127.0.0.1:9092
 ; (issue #27). The port must match AUDIOSOCKET_LISTEN in .env.
 ; TryExec: if the agent isn't running, carry on to Hangup() instead of stopping with an error.
 same => n,TryExec(AudioSocket(${AS_UUID},host.docker.internal:9092))
 same => n,Hangup()

; Runs when any call in this context ends, however it ends, including after a transfer to
; 2000. AstDB keeps entries until deleted, so the two entries of an agent call are removed here.
; `DB_DELETE(...)=ignored` is the form that works without live_dangerously
; (funcs/func_db.c:146-151 in the 22.11.0 source).
exten => h,1,GotoIf($["${AS_UUID}" = ""]?done)   ; not an agent call: nothing to delete
 same => n,Set(DB_DELETE(audiosocket_channel/${AS_UUID})=ignored)
 same => n,Set(DB_DELETE(audiosocket_caller/${AS_UUID})=ignored)
 same => n(done),NoOp()
