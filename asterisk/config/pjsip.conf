; PJSIP: the SIP transport and the two phones, 1001 and 2000 (issue #14).
;
; How the network looks from inside this container. The phones reach Asterisk through Docker
; Desktop's published ports. Every SIP and RTP packet therefore arrives from the Docker network's
; gateway, never from the phone's own address: 172.17.0.1 on Docker's default network in the
; test on issue #30, 172.20.0.1 on this Compose file's network (`pjsip show contacts`), and
; Asterisk's own address is a container address no phone can reach. To the phones, Asterisk is
; behind a NAT. So:
;   - Asterisk advertises the laptop's Wi-Fi address, not its own (the transport below);
;   - it answers each phone at the address the phone's packets came from, which leads back
;     through Docker's port forwarding (the endpoint template below).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; external_signaling_address and external_media_address are appended from
; pjsip_generated.conf, included below: the laptop's current Wi-Fi address, read by
; `make asterisk-up` because it changes between networks (issue #27).
;
; local_net is left unset on purpose. With no local_net, Asterisk puts the external address in
; the Contact, Via and SDP of every message (res_pjsip_nat.c:363-372 and
; res_pjsip_session.c:5611-5615 in the 22.11.0 source). With one set, it would skip that for
; destinations inside it.
;
; A changed transport needs a restart, not a reload (allow_reload=no by default,
; pjsip.conf.sample). `make asterisk-up` recreates the container every time.

; Generated from .env by asterisk/configure.sh and ignored by git: never commit it. It holds
; the transport's external addresses, the [wifi-address] template used by [phone] below, and
; the passwords (1001-auth, 2000-auth). Included here, after the transport it appends to and
; before the template that uses it.
#include "pjsip_generated.conf"

; No [anonymous] endpoint, so a request that matches no phone is refused. No type=identify and
; no ACL: every packet arrives from the same gateway address, so a rule on the source IP would
; match everyone or no one (issue #30). A phone is recognised by its username and must pass
; digest authentication with its password.

; Settings every phone shares. (!) marks a template, used below as [1001](phone). It inherits
; [wifi-address] from pjsip_generated.conf, which sets from_domain: without it, the From header
; of a call to a phone carried the container's own address (172.20.0.2), and redialling that
; caller from the phone's call history went nowhere.
[phone](!,wifi-address)
type=endpoint
transport=transport-udp
; The only extensions a phone can reach: extensions.conf, [from-phones].
context=from-phones
disallow=all
allow=ulaw,alaw
; Audio always goes through Asterisk. The phones can't send it to each other directly,
; since neither can reach the other's address through Docker.
direct_media=no
; "Send RTP back to the same address/port we received it from" (docs.asterisk.org,
; "Configuring res_pjsip to work through NAT"): back through Docker's port forwarding, rather
; than to the address in the phone's SDP.
rtp_symmetric=yes
; The same for SIP responses (the default; stated so the set is visible in one place).
force_rport=yes
; Store each phone's contact as the address its REGISTER came from, so a call to that phone
; goes back through Docker's port forwarding too.
rewrite_contact=yes

[phone-aor](!)
type=aor
max_contacts=1
; A new registration replaces the old contact, e.g. after the phone changes port.
remove_existing=yes
; Asterisk sends OPTIONS every 30 s. `pjsip show contacts` then shows whether each phone is
; still reachable. It should also keep Docker's forwarding for that phone in use (inferred;
; Docker doesn't document when an idle UDP forwarding expires).
qualify_frequency=30

; 1001: the resident's phone, Linphone on Android.
[1001](phone)
auth=1001-auth
aors=1001
callerid="Resident" <1001>

[1001](phone-aor)

; 2000: the dispatcher's softphone: Linphone on an iPad.
[2000](phone)
auth=2000-auth
aors=2000
callerid="Dispatcher" <2000>

[2000](phone-aor)
