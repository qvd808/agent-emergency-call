[package]
name = "agent"
version = "0.1.0"
edition.workspace = true

[dependencies]
hound = "3.5.1"
piper-rs = "0.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rubato = "5.0.0"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
turn = { path = "../turn" }
whisper-rs = "0.16.0"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["test-util", "rt", "macros", "time", "io-util"] }
