# Asterisk only. The agent and Ollama run natively in Ubuntu (issue #26).
services:
  asterisk:
    build: ./asterisk
    image: agent-emergency-call/asterisk:22.11.0
    # Docker Desktop documents host networking for localhost traffic only, so SIP and RTP
    # are published as ports instead (issue #26).
    ports:
      - "5060:5060/udp"
      # Must match rtpstart/rtpend in asterisk/config/rtp.conf.
      - "10000-10099:10000-10099/udp"
      # AMI goes on 127.0.0.1:5038 only (issue #27), added by the task that writes
      # manager.conf.
    volumes:
      - ./asterisk/config:/etc/asterisk:ro
    # Runs only between `make asterisk-up` and `make asterisk-down`, never on its own after a
    # reboot or a Docker Desktop restart (issue #30).
    restart: "no"
    # The image already runs as a non-root user (asterisk/Dockerfile). On top of that, drop
    # every Linux capability and block regaining any through a setuid binary (issue #30).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
